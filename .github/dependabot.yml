version: 2
registries:
  dhi:
    type: docker-registry
    url: https://dhi.io
    # Dependabot kan ikke lese vars, så brukernavnet må også ligge som Dependabot-secret
    username: ${{ secrets.DOCKERHUB_USERNAME }}
    password: ${{ secrets.DOCKERHUB_TOKEN }}
updates:
  - package-ecosystem: "docker"
    directory: "/"
    registries:
      - dhi
    schedule:
      interval: 'daily'
      time: '00:00'
      timezone: 'Europe/Oslo'
  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    schedule:
      interval: "weekly"
